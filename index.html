<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111214" />
<meta name="description" content="눈치 백단 더미 - 뭐라고 치든 표정으로 대답하는 3D 얼굴" />
<title>눈치 백단 더미</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙂</text></svg>" />
<link rel="stylesheet" href="face.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body class="intro-open">
<div id="app">
  <header>
    <div class="titles">
      <h1>눈치 백단 더미</h1>
      <p class="sub">뭐라고 치든 표정으로 대답해요</p>
    </div>
  </header>

  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="face-tools">
      <button type="button" id="change-photo">📷 내 사진 입히기</button>
      <button type="button" id="original-face" hidden>↩ 원래 더미로</button>
    </div>
    <div id="loading">얼굴 불러오는 중...</div>
  </div>

  <form id="panel" autocomplete="off">
    <textarea id="text" rows="2" maxlength="200" placeholder="아무 말이나 쳐보세요"></textarea>
    <div class="row">
      <span id="status"><i class="dot"></i><span id="status-text">입력을 기다리는 중</span></span>
      <button type="button" id="clear">지우기</button>
    </div>
    <div id="mode"></div>
  </form>

  <!-- 첫 화면 -->
  <section id="intro">
    <div class="intro-card">
      <p class="kicker">뭐라고 치든 표정으로 대답해요</p>
      <h2>눈치 백단 더미</h2>
      <p class="desc">내 사진을 입히면 더미가 <b>내 얼굴로</b><br />웃고, 삐지고, 놀라요.</p>

      <button type="button" class="btn primary" id="camera-btn">📷 카메라로 찍기 (가이드)</button>
      <label class="btn" id="photo-btn">
        🖼️ 앨범에서 고르기
        <input type="file" id="photo" accept="image/*" hidden />
      </label>
      <button type="button" class="btn ghost" id="skip">사진 없이 그냥 더미로 시작</button>
      <button type="button" class="btn link" id="remove-photo" hidden>사진 빼고 원래 더미로</button>

      <p id="intro-msg" role="status"></p>

      <ul class="tips">
        <li>정면을 보고, 무표정인, 밝은 사진이 제일 잘 나와요</li>
        <li>사진은 서버로 올라가지 않고 이 기기 안에서만 처리돼요</li>
        <li>본인 사진이나 허락받은 사진만 써주세요</li>
      </ul>
    </div>
  </section>

  <!-- 가이드 카메라 -->
  <section id="camera" hidden>
    <div id="cam-box">
      <video id="cam-video" playsinline autoplay muted></video>
      <svg class="guide" viewBox="0 0 300 400" aria-hidden="true">
        <ellipse cx="150" cy="190" rx="92" ry="122" />
        <line class="thin" x1="70" y1="172" x2="230" y2="172" />
        <ellipse class="part" cx="116" cy="172" rx="17" ry="8" />
        <ellipse class="part" cx="184" cy="172" rx="17" ry="8" />
        <path class="part" d="M150 186 L150 222 M138 226 Q150 232 162 226" />
        <path class="part" d="M122 256 Q150 264 178 256" />
        <line class="thin" x1="150" y1="68" x2="150" y2="312" />
      </svg>
      <p class="cam-tip">눈·코·입을 선에 맞추고<br />정면을 보고, 입을 다문 무표정으로</p>
    </div>
    <div class="cam-bar">
      <button type="button" id="cam-cancel">취소</button>
      <button type="button" id="cam-shot" aria-label="찍기"></button>
      <button type="button" id="cam-flip" aria-label="카메라 전환">🔄</button>
    </div>
  </section>
</div>

<script type="module" src="face.js"></script>
</body>
</html>
